<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Monitoring System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>System Monitoring Dashboard</h1>
            <span id="status-indicator">Status: Live</span>
        </header>

        <main class="grid">
            <div class="card">
                <h3>CPU Auslastung</h3>
                <div class="metric-value" id="cpu-usage">-- %</div>
            </div>
            <div class="card">
                <h3>Arbeitsspeicher (RAM)</h3>
                <div class="metric-value" id="ram-usage">-- %</div>
            </div>
            <div class="card">
                <h3>Festplattenspeicher</h3>
                <div class="metric-value" id="disk-usage">-- %</div>
            </div>
        </main>
    </div>
</body>
</html>
